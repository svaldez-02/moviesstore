{% extends 'base.html' %}
{% block content %}
<header class="masthead bg-index text-white text-center py-4">
  <div class="container d-flex align-items-center flex-column pt-2">
    <h2>Movies Store</h2>
    <p>Your Ticket to Unlimited Entertainment!</p>
  </div>
</header>

<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <h4>Welcome to the best movie store!!</h4>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <h4> Featured Movies </h4>
      </div>
    </div>

    <div class="row">
      {% for movie in template_data.movies%}

      <div class="col-md-3 mb-4">
          <div class="card h-100">

        <img 
          src="{{movie.image.url}}"
          class="card-img-top"
          alt="{{ movie.name}}"
        />
        
        <div class="card-body text-center">
          <h5 class="card-title">
            {{ movie.name }}
          </h5>

          <p class="card-text">
            ${{ movie.price }}
         </p>

          <a 
            href="{% url 'movies.show' id=movie.id %}"
            class="btn btn-primary"
          >
            View Movie
        </a>
        </div>
        </div>
      </div>
        {% endfor %}
    </div>

  </div>
</div>
{% endblock content %}
